<ion-content class="fondo">
  <div class="contenedor-central">
    <div class="contenedor-logo">
      <img src="assets/icon/logo-app.png" alt="Logo Swap" class="logo" />
      <p class="subtitulo">Renueva tu estilo, sin gastar de más</p>
    </div>

    <div class="card-login">
      <h2 class="titulo">
        {{ modoRegistro ? 'Únete a la comunidad' : '¡Bienvenido de vuelta!' }}
      </h2>

      <!-- Pestañas -->
      <div class="tabs">
        <button
          type="button"
          class="tab"
          [class.activo]="!modoRegistro"
          (click)="modoRegistro = false"
        >
          Iniciar Sesión
        </button>

        <button
          type="button"
          class="tab"
          [class.activo]="modoRegistro"
          (click)="modoRegistro = true"
        >
          Registro
        </button>
      </div>

      <!-- FORMULARIO LOGIN -->
      <ng-container *ngIf="!modoRegistro">
        <ion-item class="input-item" lines="none">
          <ion-icon name="mail-outline" slot="start" aria-hidden="true"></ion-icon>
          <ion-input
            type="email"
            inputmode="email"
            autocomplete="email"
            placeholder="Correo electrónico"
            aria-label="Correo electrónico"
            [(ngModel)]="correoSign"
          ></ion-input>
        </ion-item>

        <ion-item class="input-item" lines="none">
          <ion-icon name="lock-closed-outline" slot="start" aria-hidden="true"></ion-icon>
          <ion-input
            type="password"
            autocomplete="current-password"
            placeholder="Contraseña"
            aria-label="Contraseña"
            [(ngModel)]="passwordSign"
          ></ion-input>
        </ion-item>

        <div class="acciones">
          <!-- Mejor que <a href="#"> -->
          <ion-button fill="clear" size="small" class="olvide" type="button">
            ¿Olvidaste tu contraseña?
          </ion-button>

          <ion-checkbox class="checkbox" labelPlacement="end">
            Recordar contraseña
          </ion-checkbox>
        </div>

        <ion-button
          type="button"
          fill="clear"
          expand="block"
          class="btn-iniciar"
          (click)="login()"
        >
          Iniciar Sesión
        </ion-button>
      </ng-container>

      <!-- FORMULARIO REGISTRO -->
      <ng-container *ngIf="modoRegistro">
        <ion-item class="input-item" lines="none">
          <ion-icon name="person-outline" slot="start" aria-hidden="true"></ion-icon>
          <ion-input
            type="text"
            autocomplete="given-name"
            placeholder="Nombre"
            aria-label="Nombre"
            [(ngModel)]="nombre"
          ></ion-input>
        </ion-item>

        <ion-item class="input-item" lines="none">
          <ion-icon name="person-outline" slot="start" aria-hidden="true"></ion-icon>
          <ion-input
            type="text"
            autocomplete="family-name"
            placeholder="Apellidos"
            aria-label="Apellidos"
            [(ngModel)]="apellidos"
          ></ion-input>
        </ion-item>

        <ion-item class="input-item" lines="none">
          <ion-icon name="mail-outline" slot="start" aria-hidden="true"></ion-icon>
          <ion-input
            type="email"
            inputmode="email"
            autocomplete="email"
            placeholder="Correo electrónico"
            aria-label="Correo electrónico"
            [(ngModel)]="correo"
          ></ion-input>
        </ion-item>

        <ion-item class="input-item" lines="none">
          <ion-icon name="lock-closed-outline" slot="start" aria-hidden="true"></ion-icon>
          <ion-input
            type="password"
            autocomplete="new-password"
            placeholder="Contraseña"
            aria-label="Contraseña"
            [(ngModel)]="password"
          ></ion-input>
        </ion-item>

        <ion-item class="input-item" lines="none">
          <ion-icon name="lock-closed-outline" slot="start" aria-hidden="true"></ion-icon>
          <ion-input
            type="password"
            autocomplete="new-password"
            placeholder="Repetir contraseña"
            aria-label="Repetir contraseña"
            [(ngModel)]="password2"
          ></ion-input>
        </ion-item>

        <ion-button
          type="button"
          fill="clear"
          expand="block"
          class="btn-iniciar"
          (click)="guardarUsuario()"
        >
          Crear cuenta
        </ion-button>
      </ng-container>

      <!-- Botón Google -->
      <div class="google-box">
        <p class="o">o</p>

        <ion-button type="button" expand="block" fill="clear" class="btn-google">
          <ion-icon name="logo-google" class="google-icon" slot="start" aria-hidden="true"></ion-icon>
          Continuar con Google
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
