server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ===============================
  # Angular / Ionic SPA routing
  # ===============================
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ===============================
  # Proxy /api -> Backend Render
  # ===============================
  location /api/ {
    proxy_pass https://proyecto-swapcloset-luis-rivas-villa.onrender.com/api/;

    proxy_http_version 1.1;

    # SNI correcto para TLS con Render
    proxy_ssl_server_name on;
    proxy_ssl_name proyecto-swapcloset-luis-rivas-villa.onrender.com;

    # Host del upstream (backend), NO el del frontend
    proxy_set_header Host proyecto-swapcloset-luis-rivas-villa.onrender.com;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_connect_timeout 30s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    proxy_buffering off;
  }
}
